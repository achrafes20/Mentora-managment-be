name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw spotless:check
      - run: ./mvnw checkstyle:check
      - run: ./mvnw verify

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Pre-populate ~/.m2 so Trivy's Java POM analyzer resolves the parent/BOM
      # chain (spring-boot-starter-parent, spring-data-bom, ...) from the local
      # cache instead of hitting Maven Central directly, which rate-limits
      # GitHub-hosted runner IPs (429, 30 min block).
      - run: ./mvnw -B dependency:go-offline -q
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
