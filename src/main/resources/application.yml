# =====================================================================
#  application.yml — Configuration principale
#  Les valeurs sensibles (mot de passe DB, secret JWT) viennent
#  des variables d'environnement définies dans .env (gitignored).
#  Ne jamais écrire de secret dans ce fichier.
# =====================================================================

spring:
  application:
    name: mentora-rh-backend

  # --- Base de données ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rh_dev}
    username: ${SPRING_DATASOURCE_USERNAME:rh_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_dev_only}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false         # désactivé : évite les problèmes de transaction hors contexte web
    hibernate:
      ddl-auto: validate        # Flyway gère le schéma — Hibernate valide uniquement
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false         # les migrations doivent toujours être en ordre
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  # --- Upload multipart ---
  # Plafond large et fixe ici : c'est LocalDiskFileStorage (app.file-storage.max-size-mb) qui
  # applique la vraie limite configurable et renvoie le motif de rejet (NFR-SEC-07), pas Spring.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # --- Jackson ---
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# --- Custom App Configurations ---
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file-storage:
    path: ${FILE_STORAGE_PATH:./data/uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}

# --- Serveur ---
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never    # jamais en prod (NFR-SEC)

# --- OpenAPI / Springdoc ---
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: ma.hbdev.rh

# --- Logging ---
logging:
  file:
    name: logs/mentora-rh.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    root: INFO
    ma.hbdev.rh: INFO
    org.flywaydb: INFO
