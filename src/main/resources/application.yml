# =====================================================================
#  application.yml — Configuration principale
#  Les valeurs sensibles (mot de passe DB, secret JWT) viennent
#  des variables d'environnement définies dans .env (gitignored).
#  Ne jamais écrire de secret dans ce fichier.
# =====================================================================

spring:
  application:
    name: mentora-rh-backend

  # --- Base de données ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rh_dev}
    username: ${SPRING_DATASOURCE_USERNAME:rh_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_dev_only}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false         # désactivé : évite les problèmes de transaction hors contexte web
    hibernate:
      ddl-auto: validate        # Flyway gère le schéma — Hibernate valide uniquement
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false         # les migrations doivent toujours être en ordre
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  # --- Upload multipart ---
  # Plafond large et fixe ici : c'est LocalDiskFileStorage (app.file-storage.max-size-mb) qui
  # applique la vraie limite configurable et renvoie le motif de rejet (NFR-SEC-07), pas Spring.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # --- Jackson ---
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# --- Custom App Configurations ---
app:
  mattermost:
    base-url: ${MATTERMOST_BASE_URL:}
    bot-token: ${MATTERMOST_BOT_TOKEN:}
    bot-user-id: ${MATTERMOST_BOT_USER_ID:}
    lookup-user-by-email: ${MATTERMOST_LOOKUP_USER_BY_EMAIL:true}
    connect-timeout-ms: ${MATTERMOST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MATTERMOST_READ_TIMEOUT_MS:5000}
  notifications:
    archivage-cron: ${NOTIFICATIONS_ARCHIVAGE_CRON:0 15 2 * * *}
    # EF-NOTIF-05 : rétention des notifications in-app avant archivage automatique.
    retention-jours: ${NOTIFICATIONS_RETENTION_JOURS:90}
  delegations:
    expiration-cron: ${DELEGATIONS_EXPIRATION_CRON:0 30 2 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file-storage:
    path: ${FILE_STORAGE_PATH:./data/uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
  # --- shared/ai (CvAnalysisProvider, EF-REC-04) ---
  # Clé vide -> NoopCvAnalysisProvider enregistré à la place (dégradation gracieuse, EF-REC-05).
  ai:
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openai/gpt-oss-20b:free}
  # --- Sécurité (NFR-SEC) : constantes techniques fixées au déploiement, jamais admin-éditables
  # en libre-service (cf. décision T4.B2 du 2026-07-24, avancement-projet.md). ---
  security:
    # Auth machine-à-machine pour les endpoints appelés uniquement par n8n (EF-REC-02/12).
    internal-webhook-secret: ${INTERNAL_WEBHOOK_SECRET:}
    lockout:
      max-attempts: ${SECURITY_LOCKOUT_MAX_ATTEMPTS:5}
      delay-minutes: ${SECURITY_LOCKOUT_DELAY_MINUTES:30}
    password-policy:
      min-length: ${SECURITY_PASSWORD_MIN_LENGTH:10}
      require-uppercase: ${SECURITY_PASSWORD_REQUIRE_UPPERCASE:true}
      require-lowercase: ${SECURITY_PASSWORD_REQUIRE_LOWERCASE:true}
      require-digit: ${SECURITY_PASSWORD_REQUIRE_DIGIT:true}
    session-inactivite-minutes: ${SECURITY_SESSION_INACTIVITE_MINUTES:30}
  # --- Recrutement (EF-REC-12) : suggestion de réactivation des candidatures "En attente". ---
  recruitment:
    reactivation:
      seuil-score: ${RECRUITMENT_REACTIVATION_SEUIL_SCORE:70}
      fenetre-mois: ${RECRUITMENT_REACTIVATION_FENETRE_MOIS:6}
  # --- Documents RH (EF-DOC-02/13/14) : surveillance planifiée, pas encore consommé par le code
  # (module document/T4.A1 pas encore implémenté) — valeurs prêtes pour quand il le sera. ---
  documents:
    delai-notification-fin-stage-jours: ${DOCUMENTS_DELAI_FIN_STAGE_JOURS:3}
    delai-notification-fin-cdd-jours: ${DOCUMENTS_DELAI_FIN_CDD_JOURS:15}
    delai-relance-fin-cdd-jours: ${DOCUMENTS_DELAI_RELANCE_FIN_CDD_JOURS:3}

# --- Serveur ---
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never    # jamais en prod (NFR-SEC)

# --- OpenAPI / Springdoc ---
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: ma.hbdev.rh

# --- Actuator ---
# Seul /actuator/health est exposé sur HTTP (jamais /env, /beans, etc. — fuite d'info NFR-SEC).
# show-details: never -> un appelant anonyme voit juste UP/DOWN, jamais l'état du DataSource
# (adresse, erreur de connexion). SecurityConfig.PUBLIC_PATHS n'ouvre que ce chemin précis.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# --- Logging ---
logging:
  file:
    name: logs/mentora-rh.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    root: INFO
    ma.hbdev.rh: INFO
    org.flywaydb: INFO
