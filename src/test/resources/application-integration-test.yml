# =====================================================================
#  application-integration-test.yml
#  Profil pour MigrationIntegrationTest (Testcontainers + PostgreSQL 14)
#  Les propriétés de datasource sont injectées automatiquement par
#  @ServiceConnection — ce fichier surcharge uniquement les autres props.
# =====================================================================

spring:
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate

app:
  # Secret fixe pour les tests de RecruitmentIntegrationTest (endpoints ingest/archivage n8n) —
  # jamais une vraie valeur, aucun rapport avec la prod (cf. InternalWebhookGuard).
  security:
    internal-webhook-secret: test-secret-integration

logging:
  level:
    root: WARN
    ma.hbdev.rh: DEBUG
    org.flywaydb: DEBUG
