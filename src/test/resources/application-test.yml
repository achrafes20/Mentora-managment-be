# =====================================================================
#  application-test.yml — Profil pour les smoke tests (RhApplicationTests)
#  Utilise H2 in-memory (PostgreSQL mode) pour éviter toute dépendance
#  à Docker. Flyway est désactivé : pas de migration pour ce profil.
# =====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:rh_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # none, pas create-drop : le smoke test ne requête aucune table, et Hibernate
      # tente de générer un "CREATE CAST" pour les enums Postgres natifs
      # (@JdbcTypeCode NAMED_ENUM) que la syntaxe H2 ne comprend pas.
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false  # Flyway ne tourne pas sur H2 (migrations Postgres-spécifiques)

logging:
  level:
    root: WARN
    ma.hbdev.rh: INFO
